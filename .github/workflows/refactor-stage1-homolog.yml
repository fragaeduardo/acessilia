name: Stage 1 homologation E2E (manual only)

on:
  # The workflow exists only on this fork branch. workflow_dispatch cannot
  # start it until it exists on the fork's default branch, which we do not
  # mutate during Stage 1. Opt-in push is the executable branch-only trigger.
  push:
    branches:
      - refactor/etapa-1-orchestrator-planner
  workflow_dispatch:
    inputs:
      confirm_homologation:
        description: "Run against the HOMOLOGATION Toolbox only"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stage1-homolog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-homolog:
    if: >-
      github.repository == 'fragaeduardo/acessilia' &&
      github.ref == 'refs/heads/refactor/etapa-1-orchestrator-planner' &&
      ((github.event_name == 'push' && vars.ACESSILIA_STAGE1_HOMOLOG_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.confirm_homologation))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOOLBOX_BASE_URL: ${{ secrets.ACESSILIA_HOMOLOG_TOOLBOX_URL }}
      TOOLBOX_API_KEY: ${{ secrets.ACESSILIA_HOMOLOG_TOOLBOX_KEY }}
      TOOLBOX_BASE_URLS: ""
      HOMOLOG_ALLOWED_HOST: ${{ vars.ACESSILIA_HOMOLOG_ALLOWED_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Require explicit homologation credentials and network access
        shell: bash
        run: |
          test -n "$TOOLBOX_BASE_URL" || { echo "Missing HOMOLOG Toolbox URL"; exit 1; }
          test -n "$TOOLBOX_API_KEY" || { echo "Missing HOMOLOG Toolbox key"; exit 1; }
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          url = os.environ["TOOLBOX_BASE_URL"]
          parsed = urlparse(url)
          expected_host = os.getenv("HOMOLOG_ALLOWED_HOST", "").strip()
          if parsed.scheme != "https" or not parsed.hostname or not expected_host:
              raise SystemExit("HOMOLOG Toolbox URL must be HTTPS and allowed host must be set")
          if parsed.hostname.casefold() != expected_host.casefold():
              raise SystemExit("Toolbox URL host is not the configured HOMOLOG allowlist host")
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit("HOMOLOG Toolbox URL contains unsupported URL components")
          PY
          curl --fail --silent --show-error --max-time 15 "$TOOLBOX_BASE_URL/v1/health" >/dev/null
      - name: Install Core and SDK dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./libs/docstruct --no-cache-dir
          python -m pip install "./libs/sdk[dev]" --no-cache-dir
          python -m pip install ".[dev]" --no-cache-dir
      - name: Real Toolbox render, mathematics and dual fusion
        run: |
          python -m pytest -q -m e2e --junitxml=homolog-results.xml \
            tests/test_toolbox_e2e.py::TestPdfClientE2E::test_render_page \
            tests/test_toolbox_e2e.py::TestMathClientE2E::test_convert_latex_to_mathml \
            tests/test_toolbox_e2e.py::TestMathClientE2E::test_verbalize_latex \
            tests/test_fusion_e2e.py::test_extract_fused_against_real_toolbox \
            tests/test_fusion_e2e.py::test_fusion_handler_with_real_toolbox \
            tests/test_stage1_homologation_e2e.py::test_gateway_health_and_chat_are_reached_only_via_homolog_toolbox
      - name: Reject skipped E2E tests
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          report = ElementTree.parse(Path("homolog-results.xml"))
          tests = report.findall(".//testcase")
          skipped = report.findall(".//skipped")
          if len(tests) != 6 or skipped:
              raise SystemExit(
                  f"HOMOLOG E2E did not execute all six contracts: "
                  f"{len(tests)} cases, {len(skipped)} skipped"
              )
          PY
