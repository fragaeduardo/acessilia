name: Stage 1 refactor validation (fork only)

on:
  push:
    branches:
      - refactor/etapa-1-orchestrator-planner

concurrency:
  group: stage1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-regression:
    name: Planning, payload and execution regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./libs/docstruct --no-cache-dir
          python -m pip install "./libs/sdk[dev]" --no-cache-dir
          python -m pip install ".[dev]" --no-cache-dir
      - name: Check Python syntax
        run: python -m compileall -q backend tests
      - name: Characterization and regression tests
        run: |
          python -m pytest -q -m "not e2e" \
            tests/test_planning_proposals.py \
            tests/test_planning_coordinator.py \
            tests/test_planning_analyzer_registry.py \
            tests/test_execution_binding_contracts.py \
            tests/test_stage1_golden_parity.py \
            tests/test_formula_recognition.py \
            tests/test_formula_classification.py \
            tests/test_region_inspection.py \
            tests/test_provider_choice_methods.py \
            tests/test_vision_provider_breaker.py \
            tests/test_pddl_modularization_contract.py \
            tests/test_formula_enrichment.py \
            tests/test_media_inspect.py \
            tests/test_no_portuguese.py \
            tests/test_noncritical_obligations.py \
            tests/test_toolbox_availability_gate.py \
            tests/test_pddl_planning.py \
            tests/test_pddl_execution_contract.py \
            tests/test_pddl_orchestrator.py \
            tests/test_pddl_payload_lists_and_callouts.py \
            tests/test_table_ast.py \
            tests/test_manifest_characterization.py
      - name: Complete Core regression suite (excluding external E2E)
        run: python -m pytest -q -m "not e2e" --junitxml=core-test-results.xml
      - name: Docstruct library regression suite
        working-directory: libs/docstruct
        run: python -m pytest -q --junitxml=docstruct-test-results.xml
      - name: SDK library regression suite
        working-directory: libs/sdk
        run: python -m pytest -q --junitxml=sdk-test-results.xml
